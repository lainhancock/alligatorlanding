<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alligator Landing — Property Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; color: #333; min-height: 100vh; }
  header { background: #1A4F8A; color: #fff; padding: 20px 16px 16px; }
  header h1 { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  header p { font-size: 13px; opacity: 0.8; }
  .period-row { display: flex; gap: 6px; padding: 12px 16px; background: #fff; border-bottom: 0.5px solid #eee; }
  .period-btn { flex: 1; padding: 8px 4px; border-radius: 8px; border: 1.5px solid #ddd; background: none; color: #666; font-size: 12px; cursor: pointer; font-family: inherit; font-weight: 400; }
  .period-btn.active { border-color: #1A4F8A; background: #E6F1FB; color: #1A4F8A; font-weight: 600; }
  .content { padding: 16px; max-width: 600px; margin: 0 auto; }
  .section-title { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 8px; padding-bottom: 4px; border-bottom: 0.5px solid #eee; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 8px; }
  .stat-card { background: #fff; border: 0.5px solid #ddd; border-radius: 8px; padding: 12px; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; color: #1A4F8A; }
  .stat-lbl { font-size: 11px; font-weight: 500; color: #333; margin-top: 2px; }
  .bar-card { background: #fff; border: 0.5px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .bar-title { font-size: 11px; font-weight: 500; color: #555; margin-bottom: 10px; }
  .bar-row { margin-bottom: 8px; }
  .bar-row-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .bar-track { height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 6px; border-radius: 3px; transition: width 0.8s ease; }
  .updated { font-size: 11px; color: #aaa; text-align: center; padding: 20px 0 32px; }
  .loading { text-align: center; padding: 60px 0; color: #888; font-size: 14px; }
  .logo { display: inline-flex; width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 8px; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; margin-right: 10px; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1><span class="logo">AL</span>Alligator Landing</h1>
  <p>Property Dashboard · Live data</p>
</header>

<div class="period-row">
  <button class="period-btn" data-days="7">7 days</button>
  <button class="period-btn active" data-days="30">30 days</button>
  <button class="period-btn" data-days="90">90 days</button>
</div>

<div class="content">
  <div class="loading" id="loading">Loading dashboard…</div>
  <div id="dashboard" style="display:none"></div>
</div>

<script>
const SUPABASE_URL = 'https://oaqkevbmyioofceopytr.supabase.co'
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9hcWtldmJteWlvb2ZjZW9weXRyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0OTQwMjUsImV4cCI6MjA5NjA3MDAyNX0.LWBKy1-q7od9zOdH7M4hSa1TPL5NuwU8zyfmjG_9XW8'

let currentDays = 30

async function query(table, select, filters) {
  const url = new URL(`${SUPABASE_URL}/rest/v1/${table}`)
  url.searchParams.set('select', select)
  Object.entries(filters || {}).forEach(([k, v]) => url.searchParams.set(k, v))
  const res = await fetch(url, { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`, Prefer: 'return=representation' } })
  if (!res.ok) { console.error(table, await res.text()); return [] }
  return res.json()
}

function sinceDate(days) {
  const d = new Date()
  d.setDate(d.getDate() - days)
  return d.toISOString().slice(0, 10)
}

function today() { return new Date().toISOString().slice(0, 10) }

function statCard(num, label, color) {
  return `<div class="stat-card"><div class="stat-num" style="color:${color||'#1A4F8A'}">${num}</div><div class="stat-lbl">${label}</div></div>`
}

function barRow(label, value, max, color) {
  const pct = max > 0 ? Math.round((value/max)*100) : 0
  return `<div class="bar-row"><div class="bar-row-top"><span>${label}</span><span style="color:#888;font-weight:500">${value}</span></div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color||'#1A4F8A'}"></div></div></div>`
}

function sectionTitle(t) { return `<div class="section-title">${t}</div>` }

async function loadDashboard() {
  document.getElementById('loading').style.display = 'block'
  document.getElementById('dashboard').style.display = 'none'

  const since = sinceDate(currentDays)
  const tod = today()
  const sinceISO = new Date(Date.now() - currentDays * 86400000).toISOString()

  const [occurrences, workOrders, notes, huntLogs, animals, feeders, events] = await Promise.all([
    query('task_occurrences', 'id,status,due_date,task_id', { 'due_date': `gte.${since}` }),
    query('work_orders', 'id,status,priority,asset,assigned_to_name,due_date', { 'created_at': `gte.${sinceISO}`, 'deleted_at': 'is.null' }),
    query('property_notes', 'id,flag,asset,created_at', { 'created_at': `gte.${sinceISO}`, 'deleted_at': 'is.null' }),
    query('hunt_logs', 'id,harvest,sightings,animal_type,hunt_date', { 'hunt_date': `gte.${since}`, 'deleted_at': 'is.null' }),
    query('animal_inventory', 'id,species,status,acquisition_type,purchase_price', {}),
    query('feeders', 'id,name,fill_level,feeder_type', { 'active': 'eq.true' }),
    query('events', 'id,name,event_date,guest_count,status', { 'created_at': `gte.${sinceISO}`, 'deleted_at': 'is.null' }),
  ])

  const totalTasks = occurrences.length
  const completed = occurrences.filter(o => o.status === 'completed').length
  const overdue = occurrences.filter(o => o.status === 'pending' && o.due_date < tod).length
  const rate = totalTasks > 0 ? Math.round((completed/totalTasks)*100) : 0

  const totalWOs = workOrders.length
  const openWOs = workOrders.filter(w => w.status === 'open').length
  const doneWOs = workOrders.filter(w => w.status === 'done').length
  const critWOs = workOrders.filter(w => w.priority === 'crit' && w.status !== 'done').length
  const woByAsset = {}
  workOrders.forEach(w => { const a = w.asset||'General'; woByAsset[a] = (woByAsset[a]||0)+1 })
  const topAssets = Object.entries(woByAsset).sort((a,b)=>b[1]-a[1]).slice(0,5)

  const urgentNotes = notes.filter(n => n.flag === 'urgent').length
  const reviewNotes = notes.filter(n => n.flag === 'review').length

  const totalHunts = huntLogs.length
  const totalHarvests = huntLogs.filter(l => l.harvest && l.harvest !== 'No harvest').length
  const totalSightings = huntLogs.reduce((a,l) => a+(l.sightings||0), 0)
  const harvestRate = totalHunts > 0 ? Math.round((totalHarvests/totalHunts)*100) : 0
  const bySpecies = {}
  huntLogs.filter(l => l.harvest && l.harvest !== 'No harvest').forEach(l => { bySpecies[l.harvest]=(bySpecies[l.harvest]||0)+1 })

  const activeAnimals = animals.filter(a => a.status === 'Active')
  const byAnimalSpecies = {}
  activeAnimals.forEach(a => { byAnimalSpecies[a.species]=(byAnimalSpecies[a.species]||0)+1 })
  const totalValue = animals.filter(a=>a.purchase_price).reduce((s,a)=>s+parseFloat(a.purchase_price||0),0)
  const bornOnProp = animals.filter(a=>a.acquisition_type==='Born on property').length

  const lowFeeders = feeders.filter(f=>f.fill_level<=25).length
  const avgFill = feeders.length>0 ? Math.round(feeders.reduce((s,f)=>s+(f.fill_level||0),0)/feeders.length) : 0

  const totalEvents = events.length
  const avgGuests = totalEvents>0 ? Math.round(events.reduce((s,e)=>s+(e.guest_count||0),0)/totalEvents) : 0

  let html = ''

  html += sectionTitle('Task completion')
  html += `<div class="stat-grid">`
  html += statCard(`${rate}%`, 'Completion rate', rate>=80?'#3B6D11':rate>=60?'#854F0B':'#A32D2D')
  html += statCard(completed, 'Completed', '#3B6D11')
  html += statCard(overdue, 'Overdue', '#A32D2D')
  html += `</div><div class="stat-grid">`
  html += statCard(totalTasks, 'Total tasks', '#555')
  html += statCard(occurrences.filter(o=>o.status==='needs_attention').length, 'Needs attention', '#854F0B')
  html += statCard(occurrences.filter(o=>o.status==='skipped').length, 'Skipped', '#888')
  html += `</div>`

  html += sectionTitle('Work orders')
  html += `<div class="stat-grid">`
  html += statCard(totalWOs, 'Total', '#555')
  html += statCard(doneWOs, 'Complete', '#3B6D11')
  html += statCard(critWOs, 'Critical open', '#A32D2D')
  html += `</div><div class="stat-grid">`
  html += statCard(openWOs, 'Open', '#555')
  html += statCard(workOrders.filter(w=>w.status==='inprogress').length, 'In progress', '#185FA5')
  html += statCard(workOrders.filter(w=>w.status==='blocked').length, 'Blocked', '#854F0B')
  html += `</div>`
  if (topAssets.length > 0) {
    html += `<div class="bar-card"><div class="bar-title">Work orders by asset</div>`
    topAssets.forEach(([a,c]) => { html += barRow(a, c, topAssets[0][1], '#1A4F8A') })
    html += `</div>`
  }

  html += sectionTitle('Property observations')
  html += `<div class="stat-grid">`
  html += statCard(notes.length, 'Total notes', '#555')
  html += statCard(urgentNotes, 'Urgent', '#A32D2D')
  html += statCard(reviewNotes, 'Needs review', '#854F0B')
  html += `</div>`

  html += sectionTitle('Hunting')
  html += `<div class="stat-grid">`
  html += statCard(totalHunts, 'Total hunts', '#555')
  html += statCard(totalHarvests, 'Harvests', '#3B6D11')
  html += statCard(`${harvestRate}%`, 'Harvest rate', '#3B6D11')
  html += `</div><div class="stat-grid">`
  html += statCard(totalSightings, 'Sightings', '#555')
  html += statCard(totalHunts>0?Math.round(totalSightings/totalHunts):0, 'Per hunt', '#555')
  html += statCard('—', 'Season', '#555')
  html += `</div>`
  if (Object.keys(bySpecies).length > 0) {
    const maxH = Math.max(...Object.values(bySpecies))
    html += `<div class="bar-card"><div class="bar-title">Harvests by species</div>`
    Object.entries(bySpecies).sort((a,b)=>b[1]-a[1]).forEach(([s,c]) => { html += barRow(s, c, maxH, '#3B6D11') })
    html += `</div>`
  }

  html += sectionTitle('Animal inventory')
  html += `<div class="stat-grid">`
  html += statCard(activeAnimals.length, 'Active herd', '#2D5016')
  html += statCard(bornOnProp, 'Born here', '#3B6D11')
  html += statCard(`$${Math.round(totalValue/1000)}k`, 'Investment', '#185FA5')
  html += `</div>`
  if (Object.keys(byAnimalSpecies).length > 0) {
    const maxA = Math.max(...Object.values(byAnimalSpecies))
    html += `<div class="bar-card"><div class="bar-title">Active herd by species</div>`
    Object.entries(byAnimalSpecies).sort((a,b)=>b[1]-a[1]).forEach(([s,c]) => { html += barRow(s, c, maxA, '#2D5016') })
    html += `</div>`
  }

  html += sectionTitle('Feeders')
  html += `<div class="stat-grid">`
  html += statCard(feeders.length, 'Total feeders', '#555')
  html += statCard(`${avgFill}%`, 'Avg fill', avgFill>=75?'#3B6D11':avgFill>=50?'#854F0B':'#A32D2D')
  html += statCard(lowFeeders, 'Need fill', lowFeeders>0?'#A32D2D':'#3B6D11')
  html += `</div>`

  html += sectionTitle('Events')
  html += `<div class="stat-grid">`
  html += statCard(totalEvents, 'Events', '#555')
  html += statCard(avgGuests||'—', 'Avg guests', '#555')
  html += statCard(events.filter(e=>e.status==='completed').length, 'Completed', '#3B6D11')
  html += `</div>`

  html += `<div class="updated">Updated: ${new Date().toLocaleString('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})} CST · alligatorlanding.com</div>`

  document.getElementById('loading').style.display = 'none'
  document.getElementById('dashboard').innerHTML = html
  document.getElementById('dashboard').style.display = 'block'
}

document.querySelectorAll('.period-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'))
    btn.classList.add('active')
    currentDays = parseInt(btn.dataset.days)
    loadDashboard()
  })
})

loadDashboard()
</script>
</body>
</html>
